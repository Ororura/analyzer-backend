services:
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-analyzer}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-analyzer}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-analyzer}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      VACANCY_SYNC_ENABLED: ${VACANCY_SYNC_ENABLED:-true}
      VACANCY_SYNC_INTERVAL: ${VACANCY_SYNC_INTERVAL:-30m}
      VACANCY_SYNC_QUERY: ${VACANCY_SYNC_QUERY:-Java Backend Developer}
      VACANCY_SYNC_PAGES_PER_CYCLE: ${VACANCY_SYNC_PAGES_PER_CYCLE:-4}
      VACANCY_SYNC_PAGE_SIZE: ${VACANCY_SYNC_PAGE_SIZE:-50}
      POLZA_API_KEY: ${POLZA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analyzer}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
