spring:
  application:
    name: analyzer
  profiles:
    default: dev
  lifecycle:
    timeout-per-shutdown-phase: 20s
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/analyzer}
    username: ${SPRING_DATASOURCE_USERNAME:analyzer}
    password: ${SPRING_DATASOURCE_PASSWORD:analyzer}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_TIMEOUT:1s}
      repositories:
        enabled: false
  cache:
    type: redis

server:
  shutdown: graceful
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  hh:
    base-url: ${HH_BASE_URL:https://hh.ru}
    connect-timeout: 3s
    read-timeout: 8s
  vacancy:
    cache:
      details-ttl: ${VACANCY_DETAILS_CACHE_TTL:45m}
      search-ttl: ${VACANCY_SEARCH_CACHE_TTL:5m}
    sync:
      enabled: ${VACANCY_SYNC_ENABLED:true}
      interval: ${VACANCY_SYNC_INTERVAL:30m}
      initial-delay: ${VACANCY_SYNC_INITIAL_DELAY:10s}
      query: ${VACANCY_SYNC_QUERY:Java Backend Developer}
      area: ${VACANCY_SYNC_AREA:}
      pages-per-cycle: ${VACANCY_SYNC_PAGES_PER_CYCLE:4}
      page-size: ${VACANCY_SYNC_PAGE_SIZE:50}
      batch-size: ${VACANCY_SYNC_BATCH_SIZE:50}
  polza:
    enabled: ${POLZA_ENABLED:true}
    base-url: ${POLZA_BASE_URL:https://polza.ai/api/v1}
    model: ${POLZA_MODEL:google/gemini-2.5-pro}
    api-key: ${POLZA_API_KEY:}
    timeout: ${POLZA_TIMEOUT:60s}
  resume:
    max-file-size: ${RESUME_MAX_FILE_SIZE:10MB}
    target-role: ${RESUME_TARGET_ROLE:Java Backend Developer}
    analysis-version: ${RESUME_ANALYSIS_VERSION:1}
    baseline-version: ${RESUME_BASELINE_VERSION:2026-08}
    max-text-length: ${RESUME_MAX_TEXT_LENGTH:200000}
    scoring:
      must-have-weight: ${RESUME_MARKET_FIT_MUST_HAVE_WEIGHT:0.40}
      skill-coverage-weight: ${RESUME_MARKET_FIT_SKILL_COVERAGE_WEIGHT:0.25}
      experience-weight: ${RESUME_MARKET_FIT_EXPERIENCE_WEIGHT:0.20}
      ats-weight: ${RESUME_MARKET_FIT_ATS_WEIGHT:0.05}
      grade-weight: ${RESUME_MARKET_FIT_GRADE_WEIGHT:0.10}
      must-have-required-frequency: ${RESUME_MUST_HAVE_REQUIRED_FREQUENCY:0.40}
      core-frequency: ${RESUME_SKILL_CORE_FREQUENCY:0.70}
      high-frequency: ${RESUME_SKILL_HIGH_FREQUENCY:0.40}
      medium-frequency: ${RESUME_SKILL_MEDIUM_FREQUENCY:0.20}
      high-gap-threshold: ${RESUME_HIGH_GAP_THRESHOLD:0.35}
      medium-gap-threshold: ${RESUME_MEDIUM_GAP_THRESHOLD:0.15}
      ats-parsing-weight: ${RESUME_ATS_PARSING_WEIGHT:0.20}
      ats-sections-weight: ${RESUME_ATS_SECTIONS_WEIGHT:0.15}
      ats-contacts-weight: ${RESUME_ATS_CONTACTS_WEIGHT:0.10}
      ats-experience-weight: ${RESUME_ATS_EXPERIENCE_WEIGHT:0.20}
      ats-education-weight: ${RESUME_ATS_EDUCATION_WEIGHT:0.10}
      ats-skills-weight: ${RESUME_ATS_SKILLS_WEIGHT:0.10}
      ats-keyword-weight: ${RESUME_ATS_KEYWORD_WEIGHT:0.15}
      high-gap-weight: ${RESUME_HIGH_GAP_WEIGHT:1.0}
      medium-gap-weight: ${RESUME_MEDIUM_GAP_WEIGHT:0.65}
      low-gap-weight: ${RESUME_LOW_GAP_WEIGHT:0.35}
      low-effort-weight: ${RESUME_LOW_EFFORT_WEIGHT:0.75}
      medium-effort-weight: ${RESUME_MEDIUM_EFFORT_WEIGHT:1.0}
      high-effort-weight: ${RESUME_HIGH_EFFORT_WEIGHT:1.5}
    market:
      min-requirement-frequency: ${RESUME_MARKET_MIN_REQUIREMENT_FREQUENCY:0.05}
      min-vacancy-count: ${RESUME_MARKET_MIN_VACANCY_COUNT:2}
      minimum-sample-size: ${RESUME_MARKET_MINIMUM_SAMPLE_SIZE:30}
      batch-size: ${RESUME_MARKET_BATCH_SIZE:5}
      max-retries: ${RESUME_MARKET_MAX_RETRIES:2}
      criteria:
        minimum-count: ${RESUME_MARKET_CRITERIA_MINIMUM_COUNT:6}
        maximum-count: ${RESUME_MARKET_CRITERIA_MAXIMUM_COUNT:10}
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:POLZA}
    codex:
      enabled: ${CODEX_ENABLED:true}
      executable: ${CODEX_EXECUTABLE:codex}
      model: ${CODEX_MODEL:}
      timeout: ${CODEX_TIMEOUT:300s}
      availability-timeout: ${CODEX_AVAILABILITY_TIMEOUT:5s}
      max-concurrent-processes: ${CODEX_MAX_CONCURRENT_PROCESSES:2}
